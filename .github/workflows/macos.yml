name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ENGINE_ASSERTIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Compile iOS app before workflow checks
        run: >-
          xcodebuild build -project NovaChess.xcodeproj -scheme NovaChess
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Official Stockfish 19 model and reference checks
        run: python3 Scripts/test-modern-engine.py
      - name: Native engine smoke tests
        run: bash Scripts/test-engine.sh
      - name: Continuous controller and app feature workflows
        run: |
          bash Scripts/test-controller.sh
          bash Scripts/test-features.sh
          bash Scripts/test-draws.sh
          bash Scripts/test-bughouse.sh
      - name: Independent variant rules
        run: |
          python3 -m venv .build/variant-tools
          .build/variant-tools/bin/pip install chess==1.11.2
          .build/variant-tools/bin/python Scripts/test-variants.py
          .build/variant-tools/bin/python Scripts/test-chess960.py
      - name: Swift and iOS build / tests
        run: bash Scripts/test-mac.sh
      - name: Preserve Xcode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-results
          path: .build/*.xcresult
          if-no-files-found: ignore
